
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;}
#g{font-family:var(--font-sans);display:flex;flex-direction:column;align-items:center;min-height:540px;}
.screen{display:none;flex-direction:column;align-items:center;width:100%;}
.screen.on{display:flex;}
#s-title{position:relative;min-height:540px;justify-content:space-between;}
.title-bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;z-index:0;}
.title-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.35) 0%,rgba(0,0,0,0.15) 40%,rgba(0,0,0,0.6) 100%);z-index:1;}
.title-top{position:relative;z-index:2;padding:2rem 1.5rem 0;text-align:center;width:100%;}
.game-title{font-size:52px;font-weight:900;line-height:1.15;color:#fff;text-shadow:0 4px 16px rgba(17, 6, 6, 0.7);}
.game-title span{color:#FF8C50;}
.title-bottom{position:relative;z-index:2;width:100%;padding:0 1rem 2rem;display:flex;flex-direction:column;align-items:center;gap:1rem;}

/* 画像切り替えオーバーレイ */
#transition-overlay{
  position:fixed;inset:0;z-index:9999;
  pointer-events:none;opacity:0;
}

#transition-overlay img{
  width:100%;height:100%;object-fit:cover;object-position:center top;
}
@keyframes fade-in-out{
  0%  {opacity:0;}
  20% {opacity:1;}
  75% {opacity:1;}
  100%{opacity:0;}
}
.fading{
  pointer-events:auto;
  animation:fade-in-out 1.8s ease forwards;
}

@keyframes fade-in{
  0%  {opacity:0;}
  100%{opacity:1;}
}
.fading{
  pointer-events:auto;
  animation:fade-in 0.3s ease forwards;
}

/* ★ 称号一覧：正方形・小さめ・中央揃え */
.rank-table{
  width:200px;          /* 正方形に近いサイズ */
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(4px);
  border-radius:12px;
  padding:10px 12px;
  display:flex;flex-direction:column;gap:4px;
}

/* リザルト画面の右下画像 */
.result-deco-img {
  position: fixed;
  bottom: 0;
  right: 0;
  width: 200px;
  pointer-events: none;
  z-index: 10;
}

.rank-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;}
.rank-row span:first-child{color:rgba(255,255,255,0.55);white-space:nowrap;flex-shrink:0;}
.rank-row span:last-child{color:#fff;font-weight:500;text-align:right;}
.rank-row.top span:last-child{color:#FFD700;}

.title-sub{font-size:13px;color:rgba(255,255,255,0.85);text-align:center;line-height:1.6;text-shadow:0 1px 4px rgba(0,0,0,0.6);}
.start-btn{font-size:22px;font-weight:500;color:#fff;background:rgba(216,90,48,0.9);border:none;border-radius:99px;cursor:pointer;font-family:'Hiragino Mincho ProN','Georgia',serif;letter-spacing:.15em;padding:12px 48px;box-shadow:0 4px 20px rgba(216,90,48,0.5);transition:opacity .15s,transform .1s;}
.start-btn:active{opacity:.8;transform:scale(.97);}

#s-cd{gap:1.5rem;padding-top:3rem;}
.cd-lbl{font-size:15px;color:var(--color-text-secondary);}
.cd-n{font-size:110px;font-weight:500;color:#D85A30;line-height:1;animation:pop .35s ease-out;}
@keyframes pop{from{transform:scale(1.5);opacity:.3;}to{transform:scale(1);opacity:1;}}
#s-game{gap:1rem;padding:1.5rem 1rem 2rem;max-width:380px;width:100%;}
.hud{display:grid;grid-template-columns:1fr 1fr 1fr;width:100%;background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:12px 8px;}
.hud-item{text-align:center;}
.hud-lbl{font-size:11px;color:var(--color-text-secondary);letter-spacing:.04em;}
.hud-v{font-size:26px;font-weight:500;color:var(--color-text-primary);}
.hud-v.red{color:#D85A30;}
@keyframes throb{from{transform:scale(1);}to{transform:scale(1.15);}}
.throbbing{animation:throb .4s infinite alternate;}
.grip-row{width:100%;display:flex;align-items:center;gap:8px;}
.grip-lbl{font-size:12px;color:var(--color-text-secondary);}
.grip-track{flex:1;height:12px;background:var(--color-background-secondary);border-radius:99px;overflow:hidden;border:.5px solid var(--color-border-tertiary);}
.grip-fill{height:100%;width:0%;border-radius:99px;background:#D85A30;transition:width .04s;}
.scene{position:relative;width:220px;height:220px;display:flex;align-items:center;justify-content:center;overflow:visible;}
.apple-btn{background:none;border:none;cursor:pointer;padding:0;touch-action:manipulation;position:relative;z-index:2;}
@keyframes hit{0%{transform:scale(1)rotate(0);}35%{transform:scale(.88)rotate(-5deg);}65%{transform:scale(1.04)rotate(3deg);}100%{transform:scale(1)rotate(0);}}
.hitting{animation:hit .12s ease;}
@keyframes pop-in{from{transform:scale(0.3);opacity:0;}to{transform:scale(1);opacity:1;}}
.popping-in{animation:pop-in .1s ease-out;}
.particle{position:fixed;border-radius:50%;pointer-events:none;animation:fly var(--dur) ease-out forwards;z-index:999;}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0deg);}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(var(--es)) rotate(var(--rot));}}
.cpop{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:18px;font-weight:500;color:#D85A30;white-space:nowrap;pointer-events:none;animation:rise .6s ease-out forwards;z-index:20;}
@keyframes rise{to{opacity:0;transform:translateX(-50%) translateY(-36px) scale(.85);}}
.ripple{position:absolute;border-radius:50%;background:rgba(216,90,48,.2);transform:scale(0);animation:rip .4s ease-out forwards;pointer-events:none;}
@keyframes rip{to{transform:scale(5);opacity:0;}}
.space-hint{display:flex;align-items:center;gap:10px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 18px;font-size:13px;color:var(--color-text-secondary);}
.key-cap{display:inline-flex;align-items:center;justify-content:center;background:var(--color-background-primary);border:1.5px solid var(--color-border-secondary);border-bottom:3px solid var(--color-border-secondary);border-radius:6px;padding:4px 14px;font-size:12px;font-weight:500;color:var(--color-text-primary);letter-spacing:.05em;transition:transform .05s,border-bottom .05s;}
.key-cap.pressed{transform:translateY(2px);border-bottom:1px solid var(--color-border-secondary);}
.tap-area{width:100%;padding:18px;background:var(--color-background-secondary);border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);font-size:15px;font-weight:500;color:var(--color-text-secondary);border-bottom:3px solid var(--color-border-secondary);cursor:pointer;touch-action:manipulation;transition:transform .05s,border-bottom .05s;text-align:center;}
.tap-area:active,.tap-area.pressed{transform:translateY(2px);border-bottom:1px solid var(--color-border-secondary);}
#s-result{gap:1.2rem;padding:2rem 1rem;max-width:380px;width:100%;}
.res-card{width:100%;background:var(--color-background-primary);border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:2rem 1.5rem;text-align:center;}
.res-n{font-size:80px;font-weight:500;color:#D85A30;line-height:1;}
.res-unit{font-size:15px;color:var(--color-text-secondary);margin-top:4px;}
.res-rank{font-size:20px;font-weight:500;color:var(--color-text-primary);margin-top:14px;}
.res-rank.legendary{color:#B8860B;font-size:22px;animation:glitter 1.2s ease-in-out infinite alternate;}
@keyframes glitter{from{text-shadow:0 0 6px rgba(255,215,0,.5);}to{text-shadow:0 0 16px rgba(255,215,0,.9),0 0 30px rgba(255,180,0,.4);}}
.btn-row{display:flex;gap:10px;width:100%;}
.btn-x{flex:1;padding:13px;font-size:15px;font-weight:500;background:#000;color:#fff;border:none;border-radius:99px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:opacity .15s;}
.btn-x:active{opacity:.75;}
.btn-retry{flex:1;padding:13px;font-size:15px;font-weight:500;background:#D85A30;color:#fff;border:none;border-radius:99px;cursor:pointer;transition:opacity .15s;}
.btn-retry:active{opacity:.8;}
</style>

<script>
const GAME_SEC=20,MAX_GRIP=100,TAP_INTERVAL=30;
const RANKS=[
  {min:0, label:'🐣 ほやほやマッチョ',  legendary:false},
  {min:8, label:'🐻‍❄️ 見習いマッチョ', legendary:false},
  {min:14,label:'🔥 期待のマッチョ', legendary:false},
  {min:19,label:'⚡ いい感じのマッチョ',           legendary:false},
  {min:21,label:'💪 本物のマッチョ',          legendary:false},
  {min:24,label:'🤖 究極のマッチョ',      legendary:false},
  {min:30,label:'✨ ガチマッチョ',    legendary:true },
];

let grip=0,crushes=0,combo=0,totalTaps=0,timeLeft=GAME_SEC,comboTmr=null,gameTmr=null,lastTap=0;
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');}
function getRank(n){let r=RANKS[0];RANKS.forEach(x=>{if(n>=x.min)r=x;});return r;}

function startCountdown(){ //カウントダウンタイマー
  const overlay = document.getElementById('transition-overlay');
  overlay.classList.remove('fading');
  void overlay.offsetWidth;
  overlay.classList.add('fading');

  setTimeout(()=>{
    show('s-cd');
    let n=3;
    const el=document.getElementById('cdn');el.textContent=n;
    const iv=setInterval(()=>{n--;if(n>0){el.textContent=n;el.style.animation='none';void el.offsetWidth;el.style.animation='pop .35s ease-out';}else{clearInterval(iv);startGame();}},900);
  }, 1500);

  setTimeout(()=>{
    overlay.classList.remove('fading');
  }, 1900);
}

function startGame(){
  grip=0;crushes=0;combo=0;totalTaps=0;timeLeft=GAME_SEC;
  resetApple();updateHUD();show('s-game');
  document.getElementById('tap-area').focus();
  gameTmr=setInterval(()=>{timeLeft--;updateHUD();if(timeLeft<=0){clearInterval(gameTmr);endGame();}},1000);
}

function updateHUD(){
  const tv=document.getElementById('h-timer');
  tv.textContent=timeLeft;tv.classList.toggle('red',timeLeft<=5);tv.classList.toggle('throbbing',timeLeft<=5);
  document.getElementById('h-combo').textContent='x'+Math.max(1,combo);
  document.getElementById('h-crush').textContent=crushes;
  const gp=grip;
  const gf=document.getElementById('grip-fill');
  gf.style.width=gp+'%';gf.style.background=gp>75?'#A32D2D':gp>45?'#BA7517':'#D85A30';
  const ab=document.getElementById('a-body');
  ab.setAttribute('fill',gp>70?'#9B2010':gp>40?'#C04020':'#D85A30');
  const cg=document.getElementById('cracks');cg.style.opacity=gp>30?'1':'0';
  document.getElementById('ck1').style.display=gp>30?'block':'none';
  document.getElementById('ck2').style.display=gp>55?'block':'none';
  document.getElementById('ck3').style.display=gp>72?'block':'none';
}
function resetApple(){
  grip=0;
  document.getElementById('a-body').setAttribute('fill','#D85A30');
  document.getElementById('cracks').style.opacity='0';
  ['ck1','ck2','ck3'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('grip-fill').style.width='0%';
  const btn=document.getElementById('apple-btn');
  btn.classList.remove('popping-in');void btn.offsetWidth;btn.classList.add('popping-in');
  btn.addEventListener('animationend',()=>btn.classList.remove('popping-in'),{once:true});
}
function onTap(){
  if(timeLeft<=0)return;
  const now=Date.now();if(now-lastTap<TAP_INTERVAL)return;lastTap=now;
  totalTaps++;
  combo++;clearTimeout(comboTmr);
  comboTmr=setTimeout(()=>{combo=0;document.getElementById('h-combo').textContent='x1';},500);
  const gain=(1+Math.min(Math.floor(combo/4),5))*(100/48);
  grip=Math.min(grip+gain,MAX_GRIP);
  const btn=document.getElementById('apple-btn');
  btn.classList.remove('hitting');void btn.offsetWidth;btn.classList.add('hitting');
  btn.addEventListener('animationend',()=>btn.classList.remove('hitting'),{once:true});
  const sc=document.getElementById('scene');
  const rip=document.createElement('div');rip.className='ripple';
  rip.style.cssText='width:36px;height:36px;left:50%;top:50%;margin:-18px 0 0 -18px;position:absolute;';
  sc.appendChild(rip);setTimeout(()=>rip.remove(),450);
  if(combo>=5&&combo%5===0){const fl=document.createElement('div');fl.className='cpop';fl.textContent=combo+' COMBO!';sc.appendChild(fl);setTimeout(()=>fl.remove(),700);}
  if(grip>=MAX_GRIP){grip=MAX_GRIP;updateHUD();doCrush();}else{updateHUD();}
}
function doCrush(){
  crushes++;resetApple();updateHUD();
  const btn=document.getElementById('apple-btn');
  const rect=btn.getBoundingClientRect();
  const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  const cols=['#D85A30','#9B2010','#F09575','#FF4500','#FF8C50','#BA7517','#FFD700','#8B0000','#FFA07A','#639922'];
  for(let i=0;i<30;i++){
    const p=document.createElement('div');p.className='particle';
    const angle=Math.random()*Math.PI*2,dist=80+Math.random()*200,size=6+Math.random()*18;
    const dur=(0.4+Math.random()*0.5).toFixed(2),endScale=(0.1+Math.random()*0.4).toFixed(2);
    const rot=(Math.random()*720-360).toFixed(0)+'deg';
    p.style.cssText=[`width:${size}px`,`height:${size}px`,`background:${cols[Math.floor(Math.random()*cols.length)]}`,
      `left:${cx}px`,`top:${cy}px`,`margin:-${size/2}px 0 0 -${size/2}px`,
      `--dx:${(Math.cos(angle)*dist).toFixed(1)}px`,`--dy:${(Math.sin(angle)*dist).toFixed(1)}px`,
      `--dur:${dur}s`,`--es:${endScale}`,`--rot:${rot}`].join(';');
    document.body.appendChild(p);setTimeout(()=>p.remove(),parseFloat(dur)*1000+100);
  }
}
function endGame(){
  show('s-result');
  const rank=getRank(crushes);
  document.getElementById('r-num').textContent=crushes;
  document.getElementById('r-taps').textContent = totalTaps;
  const rankEl=document.getElementById('r-rank');
  rankEl.textContent=rank.label;rankEl.className='res-rank'+(rank.legendary?' legendary':'');
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (e.repeat) return; // ここを追加：長押しによる繰り返し実行を無視する
    document.getElementById('key-cap').classList.add('pressed');
    onTap();
  }
});

document.addEventListener('keyup',e=>{if(e.code==='Space')document.getElementById('key-cap').classList.remove('pressed');});
const tapArea=document.getElementById('tap-area');
tapArea.addEventListener('mousedown',onTap);
tapArea.addEventListener('touchstart',e=>{e.preventDefault();tapArea.classList.add('pressed');onTap();},{passive:false});
tapArea.addEventListener('touchend',()=>tapArea.classList.remove('pressed'));
const appleBtn=document.getElementById('apple-btn');
appleBtn.addEventListener('click',onTap);
appleBtn.addEventListener('touchstart',e=>{e.preventDefault();onTap();},{passive:false});
document.getElementById('start-btn').addEventListener('click',startCountdown);
document.getElementById('btn-retry').addEventListener('click',()=>show('s-title'));
document.getElementById('btn-x').addEventListener('click',()=>{
  const rank=getRank(crushes);
  const txt=`20秒でりんごを${crushes}個握りつぶした！💪🍎\n称号：${rank.label}\n連打回数${totalTaps}回\n#マッスルリンゴクラッシュ`;
  const gameUrl = window.location.origin;
  window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(txt),'_blank');
  
});
</script>
